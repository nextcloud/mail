name: Issue template check

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  check-template:
    runs-on: ubuntu-latest-low

    if: >-
      github.repository_owner != 'nextcloud-gmbh'
      && github.event.issue.type == null

    steps:
      - name: Ask for the issue form
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          NEW_ISSUE_URL: https://github.com/${{ github.repository }}/issues/new/choose
        run: |
          # Field labels of .github/ISSUE_TEMPLATE/bug_report_form.yml
          missing=false
          for heading in "Steps to reproduce" "Expected behavior" "Actual behavior" "Mail app version" "Nextcloud version"; do
            if ! grep -qiE "^#{1,6}[[:space:]]+${heading}[[:space:]]*$" <<< "$ISSUE_BODY"; then
              missing=true
            fi
          done
          if [ "$missing" = false ]; then
            echo "All form headings present, nothing to do"
            exit 0
          fi

          gh issue edit "$ISSUE_NUMBER" --add-label "0. to triage" --add-label "needs info"
          gh issue comment "$ISSUE_NUMBER" --body "Thanks for the report! This issue was not created with one of our issue forms, which are required for bug reports and feature requests. The forms ask for the app version, server version, logs and other details we need to triage an issue.

          Please do one of the following:

          - Close this issue and [open a new one with the matching form]($NEW_ISSUE_URL).
          - Replace the description of this issue with the content of the matching form, with all of its headings and fields filled in.

          If you submitted this through the GitHub CLI or an API client, please use the web form instead. A maintainer will add the labels afterwards. Without the requested details this issue may be closed."
